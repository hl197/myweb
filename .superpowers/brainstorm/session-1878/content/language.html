<h2>语言偏好？</h2>
<p class="subtitle">网站使用什么语言</p>

<div class="options">
  <div class="option" data-choice="cn" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>仅中文</h3>
      <p>全部内容用中文，简单直接</p>
    </div>
  </div>
  <div class="option" data-choice="en" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>仅英文</h3>
      <p>全部用英文，国际化风格</p>
    </div>
  </div>
  <div class="option" data-choice="both" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>中英双语</h3>
      <p>支持切换，架构稍微复杂些但覆盖面更广</p>
    </div>
  </div>
</div>
