<h2>页面结构偏好？</h2>
<p class="subtitle">内容如何组织展示</p>

<div class="options">
  <div class="option" data-choice="single" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>单页滚动</h3>
      <p>所有内容在一页，导航点击滚动到对应区块，流畅顺滑</p>
    </div>
  </div>
  <div class="option" data-choice="multi" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>多页面</h3>
      <p>首页 + 独立页面（项目页、关于页等），适合内容多的情况</p>
    </div>
  </div>
  <div class="option" data-choice="hybrid" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>混合</h3>
      <p>首页单页展示核心内容，部分详情页（如项目详情）独立页面</p>
    </div>
  </div>
</div>
