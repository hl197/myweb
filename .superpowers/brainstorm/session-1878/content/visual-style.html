<h2>整体风格偏好？</h2>
<p class="subtitle">选一个最接近你审美的方向</p>

<div class="options">
  <div class="option" data-choice="minimal" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>极简干净</h3>
      <p>大量留白、无衬线字体、黑白为主、少量点缀色</p>
    </div>
  </div>
  <div class="option" data-choice="tech" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>科技感/开发者风</h3>
      <p>暗色主题、代码风格元素、霓虹/渐变点缀、等宽字体</p>
    </div>
  </div>
  <div class="option" data-choice="creative" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>创意/个性化</h3>
      <p>丰富色彩、手绘/有机元素、动效丰富、打破网格</p>
    </div>
  </div>
  <div class="option" data-choice="warm" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>温暖/柔和</h3>
      <p>暖色调、圆角卡片、柔和阴影、亲切感</p>
    </div>
  </div>
</div>
