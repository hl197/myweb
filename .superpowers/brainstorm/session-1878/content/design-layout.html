<div class="section">
  <h3>导航设计</h3>
  <ul style="line-height: 2; color: #ccd6f6">
    <li><strong>固定顶部导航栏</strong> — 半透明毛玻璃效果</li>
    <li>导航链接点击<strong>平滑滚动</strong>到对应区块</li>
    <li>滚动时<strong>高亮当前区块</strong>对应的导航项</li>
    <li>导航栏在向下滚动时<strong>自动隐藏</strong>，向上滚动时重新出现</li>
  </ul>
</div>

<div class="section">
  <h3>布局特点</h3>
  <ul style="line-height: 2; color: #ccd6f6">
    <li>全屏宽布局，内容区域<strong>最大宽度 1100px</strong> 居中</li>
    <li>每个版块占一屏高度或按内容自适应</li>
    <li>版块之间用 subtle 分隔线或视差过渡</li>
  </ul>
