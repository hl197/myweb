<h2>技术实现偏好？</h2>
<p class="subtitle">你想用什么方式搭建</p>

<div class="options">
  <div class="option" data-choice="vanilla" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>纯 HTML + CSS + JS</h3>
      <p>零依赖，直接写静态文件，丢到任何服务器就能跑</p>
    </div>
  </div>
  <div class="option" data-choice="react" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>React / Next.js</h3>
      <p>组件化开发，功能扩展方便，但需要构建工具</p>
    </div>
  </div>
  <div class="option" data-choice="vue" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>Vue / Nuxt</h3>
      <p>上手简单，生态丰富，同样需要构建工具</p>
    </div>
  </div>
</div>
