<h2>个人主页包含哪些版块？</h2>
<p class="subtitle">选中最想展示的内容，可多选</p>

<div class="options" data-multiselect>
  <div class="option" data-choice="hero" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>个人品牌区</h3>
      <p>姓名、头像、一句话简介、座右铭</p>
    </div>
  </div>
  <div class="option" data-choice="social" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>社交链接</h3>
      <p>GitHub、知乎、B站、Twitter/X、邮箱等</p>
    </div>
  </div>
  <div class="option" data-choice="skills" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>技能标签</h3>
      <p>技术栈、工具、语言等技能展示</p>
    </div>
  </div>
  <div class="option" data-choice="projects" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>作品/项目</h3>
      <p>做过啥项目，附链接和描述</p>
    </div>
  </div>
  <div class="option" data-choice="blog" onclick="toggleSelect(this)">
    <div class="letter">E</div>
    <div class="content">
      <h3>博客/文章</h3>
      <p>写的文章列表，或链接到博客</p>
    </div>
  </div>
  <div class="option" data-choice="timeline" onclick="toggleSelect(this)">
    <div class="letter">F</div>
    <div class="content">
      <h3>经历时间线</h3>
      <p>教育、工作、里程碑事件</p>
    </div>
  </div>
  <div class="option" data-choice="music" onclick="toggleSelect(this)">
    <div class="letter">G</div>
    <div class="content">
      <h3>个人兴趣</h3>
      <p>音乐、摄影、游戏等个性化内容</p>
    </div>
  </div>
</div>
